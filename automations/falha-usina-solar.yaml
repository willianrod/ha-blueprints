id: "1790709200133"
alias: Falha na Usina Solar
description: >-
  Notifica o iPhone e anuncia no tablet quando a usina solar reporta falha,
  para não perder geração (e receita) sem perceber.
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.ada_house_plant_fault
    to: "on"
action:
  - alias: anunciar no tablet da cozinha
    if:
      - condition: template
        value_template: "{{ states('assist_satellite.tablet_1') not in ['unavailable', 'unknown'] }}"
    then:
      - action: assist_satellite.announce
        data:
          message: Atenção! A usina solar reportou uma falha. Verifique o aplicativo da Sungrow.
        target:
          entity_id: assist_satellite.tablet_1
  - action: notify.mobile_app_iphone_de_willian
    data:
      title: Falha na usina solar
      message: "Falha detectada às {{ now().strftime('%H:%M') }} — verifique o app da Sungrow."
