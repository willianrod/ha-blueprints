id: "1790709200124"
alias: Mesa Ações do Celular
description: >-
  Trata os botões das notificações do coach de postura: Levantar agora
  (preset 1), Sentar agora (preset 2) e Adiar 10 min. O adiamento renova o
  aviso (o movimento automático só acontece 10 min após o último aviso) e é
  limitado a 2 vezes por ciclo — depois disso o botão de adiar é ignorado
  para garantir que você não fique sentado indefinidamente. O contador é
  zerado a cada troca de postura (mesa-troca-postura).
mode: queued
max: 5
trigger:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: LEVANTAR_MESA
    id: levantar
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: SENTAR_MESA
    id: sentar
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: ADIAR_MESA
    id: adiar
condition:
  - condition: state
    entity_id: binary_sensor.sensor_de_presenca_escritorio_presence
    state: "on"
action:
  - choose:
      - conditions:
          - condition: trigger
            id: levantar
        sequence:
          - action: button.press
            data: {}
            target:
              entity_id: button.desk_preset_1
      - conditions:
          - condition: trigger
            id: sentar
        sequence:
          - action: button.press
            data: {}
            target:
              entity_id: button.desk_preset_2
      - conditions:
          - condition: trigger
            id: adiar
          - condition: numeric_state
            entity_id: input_number.mesa_adiamentos
            below: 2
        sequence:
          - action: input_datetime.set_datetime
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            target:
              entity_id: input_datetime.ultimo_aviso_postura
          - action: input_number.increment
            data: {}
            target:
              entity_id: input_number.mesa_adiamentos
