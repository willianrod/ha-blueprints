    to: unavailable
    for: "01:00:00"
condition:
  - condition: template
    value_template: >-
      {{ (states | selectattr('state', 'eq', 'unavailable')
          | map(attribute='entity_id') | list) | count < 10 }}
action:
  - alias: anunciar no tablet da cozinha
    if:
      - condition: template
        value_template: "{{ states('assist_satellite.tablet_1') not in ['unavailable', 'unknown'] }}"
    then:
      - action: assist_satellite.announce
        data:
          message: >-
            Aviso: {{ trigger.to_state.attributes.friendly_name or trigger.entity_id }}
            está offline há uma hora.
        target:
          entity_id: assist_satellite.tablet_1
  - action: notify.iphone_de_willian
    data:
      title: Dispositivo Zigbee offline
      message: >-
        {{ trigger.to_state.attributes.friendly_name or trigger.entity_id }}
        está indisponível há 1 hora.
