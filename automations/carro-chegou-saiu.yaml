id: "1790709200107"
alias: Carro chegou ou saiu
description: >-
  Notifica quando um carro fica detectado por 90s na zona da calçada
  (chegada) ou some por 90s (partida).
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.calcada_car_occupancy
    to: "on"
    for: "00:01:30"
    id: chegou
  - platform: state
    entity_id: binary_sensor.calcada_car_occupancy
    to: "off"
    for: "00:01:30"
    id: saiu
action:
  - alias: anunciar no tablet da cozinha
    if:
      - condition: template
        value_template: "{{ states('assist_satellite.tablet_1') not in ['unavailable', 'unknown'] }}"
    then:
      - action: assist_satellite.announce
        data:
          message: >-
            {{ 'O carro chegou na frente de casa.' if trigger.id == 'chegou'
               else 'O carro saiu.' }}
        target:
          entity_id: assist_satellite.tablet_1
  - action: notify.iphone_de_willian
    data:
      title: "{{ 'Carro chegou na frente' if trigger.id == 'chegou' else 'Carro saiu' }}"
      message: >-
        Detectado pela camera da frente (zona calcada) as
        {{ now().strftime('%H:%M') }}.
