id: "1790709200001"
alias: Controle Remoto Corredor
description: >-
  Controle de 4 botões no corredor do mezanino (fora da suíte).
  Botão 1: luz do corredor (L3). Botão 2: sanca do corredor.
  Botão 3: luz da suíte. Botão 4: modo Dormir — executa o script
  modo_dormir (apaga luzes das áreas comuns, desliga ACs de escritório,
  cozinha, sala e cinema, deixa o AC da suíte em 24C, desliga TV/soundbar,
  ativa input_boolean.modo_dormir e deixa a sanca do corredor acesa como
  iluminação suave).
use_blueprint:
  path: willianrod/zigbee-remote.yaml
  input:
    action_sensor: sensor.controle_romoto_corredor_action
    button_1_single:
      - action: switch.toggle
        metadata: {}
        target:
          entity_id: switch.corredor_l3
        data: {}
    button_2_single:
      - action: light.toggle
        metadata: {}
        target:
          entity_id: light.sanca_corredor
        data: {}
    button_3_single:
      - action: switch.toggle
        metadata: {}
        target:
          entity_id: switch.suite_porta_left
        data: {}
    button_4_single:
      - alias: executar rotina de dormir
        action: script.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: script.modo_dormir
