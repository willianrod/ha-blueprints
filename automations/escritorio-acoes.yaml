id: "1790709200126"
alias: Escritório Ações do Celular
description: >-
  Trata os botões da notificação de calor do escritório: Ligar AC (24C cool)
  ou Agora não (o convite respeita o intervalo de 2h sozinho).
mode: queued
max: 5
trigger:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: LIGAR_AC_ESCRITORIO
    id: ligar
condition:
  - condition: state
    entity_id: binary_sensor.sensor_de_presenca_escritorio_presence
    state: "on"
action:
  - action: climate.set_temperature
    data:
      temperature: 24
      hvac_mode: cool
    target:
      entity_id: climate.quarto_1_ar_escritorio
