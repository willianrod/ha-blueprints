id: "1790709200101"
alias: Modo Manhã
description: >-
  Encerra o modo Dormir no primeiro movimento detectado na escada entre 5h e
  11h, executando o script bom_dia (apaga a iluminação noturna e anuncia o
  resumo do clima no tablet da cozinha).
mode: single
trigger:
  - platform: state
    entity_id:
      - binary_sensor.sensor_escada_superior_occupancy
      - binary_sensor.sensor_escada_inferior_occupancy
    to: "on"
condition:
  - condition: state
    entity_id: input_boolean.modo_dormir
    state: "on"
  - condition: time
    after: "05:00:00"
    before: "11:00:00"
action:
  - alias: executar rotina de bom dia
    action: script.turn_on
    data: {}
    target:
      entity_id: script.bom_dia
