id: "1790709200130"
alias: Campainha Visitante
description: >-
  Quando a campainha detecta um visitante, notifica o iPhone com imagem ao
  vivo da câmera da porta e anuncia no tablet da cozinha.
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.doorbell_visitor
    to: "on"
action:
  - alias: anunciar no tablet da cozinha
    if:
      - condition: template
        value_template: "{{ states('assist_satellite.tablet_1') not in ['unavailable', 'unknown'] }}"
    then:
      - action: assist_satellite.announce
        data:
          message: Tem alguém na porta de entrada.
        target:
          entity_id: assist_satellite.tablet_1
  - action: notify.send_message
    target:
      entity_id: notify.iphone_de_willian
    data:
      title: Alguém na porta
      message: "Visitante detectado às {{ now().strftime('%H:%M') }}."
      data:
        push:
          category: camera
        entity_id: camera.doorbell_fluent
