id: "1790709200131"
alias: Alarme da Cerca Elétrica
description: >-
  Disparo do alarme da cerca elétrica: alerta imediato no iPhone e anúncio
  no tablet. À noite, liga a sirene da campainha por 2 minutos e acende a
  faixada e o refletor dos fundos.
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.esp_fence_fence_alarm
    to: "on"
action:
  - alias: anunciar no tablet da cozinha
    if:
      - condition: template
        value_template: "{{ states('assist_satellite.tablet_1') not in ['unavailable', 'unknown'] }}"
    then:
      - action: assist_satellite.announce
        data:
          message: Atenção! O alarme da cerca elétrica disparou. Verifique o perímetro.
        target:
          entity_id: assist_satellite.tablet_1
  - action: notify.mobile_app_iphone_de_willian
    data:
      title: Alarme da cerca elétrica
      message: "Disparo às {{ now().strftime('%H:%M') }} — verifique o perímetro."
  - alias: dissuadir invasor a noite
    if:
      - condition: sun
        after: sunset
    then:
      - action: switch.turn_on
        data: {}
        target:
          entity_id:
            - switch.faixada
            - switch.refletor_fundos
      - action: siren.turn_on
        data:
          duration: 120
        target:
          entity_id: siren.doorbell_siren
