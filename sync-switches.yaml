blueprint:
  name: Synchronized Switches & Lights
  description: >
    Keeps two or more switches and/or lights in sync. When any of them turns on
    or off, all the others follow almost instantly. Works with any mix of switch
    and light entities (e.g. bind a light to a switch so toggling either one
    mirrors the other). Loop-safe: it ignores state changes caused by the
    automation itself (echo suppression via context) and only acts when an entity
    is actually out of step with the trigger, so spamming never starts a feedback
    loop.
  domain: automation
  input:
    entities:
      name: Switches & Lights to Synchronize
      description: Select two or more switch and/or light entities that should mirror each other.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

mode: single
max_exceeded: silent

variables:
  entity_list: !input entities

trigger:
  - platform: state
    entity_id: !input entities
    not_to:
      - "unavailable"
      - "unknown"

action:
  - alias: "Only sync on real (non-automation) changes when some entity is out of step"
    if:
      - alias: "Ignore changes caused by this automation (breaks echo loops)"
        condition: template
        value_template: "{{ trigger.to_state.context.parent_id is none }}"
      - alias: "Only sync when some other entity is out of step"
        condition: template
        value_template: >
          {{ expand(entity_list)
             | rejectattr('entity_id', 'eq', trigger.entity_id)
             | selectattr('state', 'ne', trigger.to_state.state)
             | list | length > 0 }}
    then:
      - alias: "Apply the trigger's new state to every synced entity"
        action: "{{ 'homeassistant.turn_on' if trigger.to_state.state == 'on' else 'homeassistant.turn_off' }}"
        target:
          entity_id: !input entities
