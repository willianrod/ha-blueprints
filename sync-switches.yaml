blueprint:
  name: Synchronized Switches
  description: >
    Keeps two or more switches in sync. When any switch turns on or off, all the
    others follow almost instantly. Loop-safe: it ignores state changes caused by
    the automation itself (echo suppression via context) and only acts when a
    switch is actually out of step with the trigger, so spamming a switch never
    starts a feedback loop.
  domain: automation
  input:
    switches:
      name: Switches to Synchronize
      description: Select two or more switches that should mirror each other.
      selector:
        entity:
          domain: switch
          multiple: true

mode: single
max_exceeded: silent

variables:
  switch_list: !input switches

trigger:
  - platform: state
    entity_id: !input switches
    not_to:
      - "unavailable"
      - "unknown"

action:
  - alias: "Only sync on real (non-automation) changes when some switch is out of step"
    if:
      - alias: "Ignore changes caused by this automation (breaks echo loops)"
        condition: template
        value_template: "{{ trigger.to_state.context.parent_id is none }}"
      - alias: "Only sync when some other switch is out of step"
        condition: template
        value_template: >
          {{ expand(switch_list)
             | rejectattr('entity_id', 'eq', trigger.entity_id)
             | selectattr('state', 'ne', trigger.to_state.state)
             | list | length > 0 }}
    then:
      - alias: "Apply the trigger's new state to every synced switch"
        action: "{{ 'homeassistant.turn_on' if trigger.to_state.state == 'on' else 'homeassistant.turn_off' }}"
        target:
          entity_id: !input switches
