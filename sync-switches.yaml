blueprint:
  name: Synchronized Switches & Lights
  description: >
    Keeps two or more switches and/or lights in sync. When any of them turns on
    or off, all the others follow almost instantly. Works with any mix of switch
    and light entities (e.g. bind a light to a switch so toggling either one
    mirrors the other).

    Loop-safe via a short cooldown: the first change syncs immediately, then a
    brief cooldown ignores the echoes (the state changes caused by this
    automation's own sync) so spamming a switch can't start a feedback loop.
  domain: automation
  input:
    entities:
      name: Switches & Lights to Synchronize
      description: Select two or more switch and/or light entities that should mirror each other.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true
    cooldown_seconds:
      name: Cooldown
      description: >-
        After a sync, ignore further changes for this long to absorb echoes and
        prevent loops. Keep it a little longer than the time your devices take to
        report their new state (default 1s is fine for most). Lower it if you
        toggle quickly and presses feel missed.
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: seconds
          mode: box

mode: single
max_exceeded: silent

variables:
  entity_list: !input entities

trigger:
  - platform: state
    entity_id: !input entities
    not_to:
      - "unavailable"
      - "unknown"

action:
  - alias: "Sync only when some entity is out of step with the trigger"
    if:
      - condition: template
        value_template: >
          {{ expand(entity_list)
             | rejectattr('entity_id', 'eq', trigger.entity_id)
             | selectattr('state', 'ne', trigger.to_state.state)
             | list | length > 0 }}
    then:
      - alias: "Apply the trigger's new state to every synced entity"
        action: "{{ 'homeassistant.turn_on' if trigger.to_state.state == 'on' else 'homeassistant.turn_off' }}"
        target:
          entity_id: !input entities
      - alias: "Cooldown to absorb the echo of this sync"
        delay: !input cooldown_seconds
