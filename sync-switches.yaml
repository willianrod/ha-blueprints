blueprint:
  name: Synchronized Switches & Lights
  description: >
    Keeps two or more switches and/or lights in sync. When any of them turns on
    or off, all the others follow almost instantly. Works with any mix of switch
    and light entities (e.g. bind a light to a switch so toggling either mirrors
    the other).

    Loop-safe: it ignores state changes caused by this automation itself (echo
    suppression via context) so spamming a switch can't start a feedback loop.
  domain: automation
  input:
    entities:
      name: Switches & Lights to Synchronize
      description: Select two or more switch and/or light entities that should mirror each other.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true
    debounce_milliseconds:
      name: Debounce
      description: >-
        The new state must be stable for this long before the automation reacts.
        Absorbs spurious echoes from your devices. Default 100ms feels instant and
        works for most; raise it only if you still see feedback loops.
      default: 100
      selector:
        number:
          min: 0
          max: 5000
          step: 10
          unit_of_measurement: milliseconds
          mode: box

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input entities
    for:
      milliseconds: !input debounce_milliseconds
    not_to:
      - "unavailable"
      - "unknown"

condition:
  - condition: template
    value_template: >-
      {{ trigger.to_state.context.id != this.context.id
         and trigger.to_state.context.parent_id != this.context.id }}

action:
  - alias: "Apply the trigger's new state to every synced entity"
    action: "{{ 'homeassistant.turn_on' if trigger.to_state.state == 'on' else 'homeassistant.turn_off' }}"
    target:
      entity_id: !input entities
  - alias: "Brief hold to absorb the echo of this sync"
    delay:
      milliseconds: 200
