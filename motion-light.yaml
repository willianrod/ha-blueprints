blueprint:
  name: Resettable Activity/Presence Timer
  description: >
    Turns on entities when triggered by one or more activity or presence sensors
    (motion, occupancy, presence, or contact sensors like doors/windows/openings).
    The timeout countdown only begins when ALL triggering sensors are clear. 
    If new activity is detected during the countdown, the timer resets completely.
  domain: automation
  input:
    trigger_sensors:
      name: Trigger Sensors
      description: One or more binary sensors to trigger the action (motion, occupancy, presence, or contact sensors).
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
            - presence
            - door
            - window
            - opening
          multiple: true
    target_entities:
      name: Targets
      description: The lights, switches, or input booleans to turn on and off.
      selector:
        target:
          entity:
            domain:
              - light
              - switch
              - input_boolean
    timeout_seconds:
      name: Timeout (Seconds)
      description: How long to keep the targets on after the last sensor has cleared.
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds

mode: restart
max_exceeded: silent

variables:
  sensors: !input trigger_sensors

trigger:
  - platform: state
    entity_id: !input trigger_sensors
    to: "on"

action:
  - alias: "Turn on the targets"
    action: homeassistant.turn_on
    target: !input target_entities

  - alias: "Wait until ALL selected sensors are clear"
    wait_template: "{{ expand(sensors) | selectattr('state', 'eq', 'on') | list | length == 0 }}"

  - alias: "Wait the specified timeout period"
    delay:
      seconds: !input timeout_seconds

  - alias: "Turn off the targets"
    action: homeassistant.turn_off
    target: !input target_entities